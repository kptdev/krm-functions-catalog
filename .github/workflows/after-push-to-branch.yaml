name: Build and push latest dev images
on:
  push:
    branches:
    - "main"

jobs:
  # Detect which path groups changed to conditionally skip build/push
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'functions/**'
              - 'build/**'
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/after-push-to-branch.yaml'

  build-push:
    name: Build and push latest images
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: kptdev/porch/.github/actions/setup-go-kpt@main
      with:
        go-version-file: documentation/go.mod
        install-kpt: 'false'
        cache-dependency-path: functions/go/*/go.sum
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push latest and github-ref images
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        make push TAG=latest,$SHORT_SHA DEFAULT_CR=ghcr.io/${{ github.repository }}
