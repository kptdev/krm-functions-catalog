# Manual patch release for functions/go KRM functions.
#
# - Input: comma-separated function names, or "all" (case-insensitive) for every Makefile function
#   except utilities in MANUAL_PATCH_EXCLUDE_FROM_ALL in scripts/manual-patch-release.sh (e.g. sleep).
#   With "all", functions without a prior functions/go/<name>/v* semver tag are skipped with a notice.
# - Resolves the latest functions/go/<name>/vMAJOR.MINOR.PATCH tag, bumps patch only.
# - Pushes multi-arch images (make func-push), long + short git tags at github.sha, then
#   creates a GitHub Release with GitHub-generated notes (scoped via previous_tag_name) plus
#   a container image section.
# - Does not rely on other workflows running after GITHUB_TOKEN pushes (see GitHub docs).

name: Manual patch release (functions/go)

on:
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Comma-separated function names (e.g. kubeconform,apply-setters), or "all" to patch-release
          every Makefile-listed function except excluded utilities (see scripts/manual-patch-release.sh).
          Functions with no prior v* semver tag are skipped with a notice when using "all".
        required: true
        type: string
      dry_run:
        description: "If true, only print planned versions (no registry, tags, or releases)"
        required: false
        type: boolean
        default: false

concurrency:
  group: manual-patch-release-catalog
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch remote tags
        run: git fetch --tags origin

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: documentation/go.mod
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Patch release (build, tag, release)
        env:
          MANUAL_PATCH_FUNCTIONS: ${{ inputs.functions }}
          MANUAL_PATCH_DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/manual-patch-release.sh
