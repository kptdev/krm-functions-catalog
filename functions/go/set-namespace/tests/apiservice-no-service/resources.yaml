apiVersion: v1
kind: Service
metadata:
  name: the-service
  namespace: example
  annotations:
    internal.kpt.dev/upstream-identifier: "|Service|example|the-service"
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: apiservice-no-service
  annotations:
    internal.kpt.dev/upstream-identifier: apiregistration.k8s.io|APIService|~C|apiservice-no-service
spec:
  group: metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: apiservice-with-service
  annotations:
    internal.kpt.dev/upstream-identifier: apiregistration.k8s.io|APIService|~C|apiservice-with-service
spec:
  group: custom.example.com
  version: v1
  groupPriorityMinimum: 100
  versionPriority: 100
  service:
    name: custom-api-server
    namespace: old-ns
